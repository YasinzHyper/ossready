name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Audit this repo with ossready doctor
        run: node dist/cli.js doctor . --strict
      - name: Smoke-test doctor --fix on an empty repo
        run: |
          dir="$(mktemp -d)"
          node dist/cli.js doctor "$dir" --fix --license mit --github-owner octo --strict

  scaffold-e2e:
    # End-to-end: a project generated by `ossready init` must pass its own checks.
    name: Scaffolded project passes its own checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Scaffold a fresh project
        run: |
          dir="$RUNNER_TEMP/scaffold-e2e"
          node dist/cli.js init "$dir" --name demo --author "Test" --github-owner YasinzHyper
          echo "SCAFFOLD_DIR=$dir" >> "$GITHUB_ENV"
      # The scaffold ships without a lockfile, so install (not ci) there too.
      - name: Install scaffold dependencies
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm install
      - name: format:check
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm run format:check
      - name: lint
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm run lint
      - name: typecheck
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm run typecheck
      - name: test
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm test
      - name: test:coverage
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm run test:coverage
      - name: build
        working-directory: ${{ env.SCAFFOLD_DIR }}
        run: npm run build
      - name: ossready doctor on the scaffold
        run: node dist/cli.js doctor "$SCAFFOLD_DIR" --strict
