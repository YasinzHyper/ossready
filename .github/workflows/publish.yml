# Managed by ossready — edit freely; `ossready sync` previews template updates (delete this line to opt out)
name: Publish

on:
  release:
    types: [published]

# Recommended: npm Trusted Publishing (OIDC). On npmjs.com → package Settings →
# Trusted Publisher → GitHub Actions, set this repository and workflow filename
# `publish.yml`. That uses `id-token: write` below; provenance is attached with
# `--provenance`. Fallback: set repository secret `NPM_TOKEN` (automation token)
# — `NODE_AUTH_TOKEN` is only set when `NPM_TOKEN` is non-empty, so an empty
# secret does not block OIDC. Trusted publishing needs npm CLI 11.5.1+; this
# workflow upgrades npm after setup-node (Node 22 ships npm 10.x).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm 11 (OIDC trusted publishing)
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish"
            exit 0
          fi
          # An empty NODE_AUTH_TOKEN (missing NPM_TOKEN) makes npm treat auth as
          # configured and skip OIDC. Keep the token only when set; otherwise drop
          # it and any empty _authToken line setup-node wrote for registry-url.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN
          else
            unset NODE_AUTH_TOKEN
            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "$npmrc" ]; then
              sed -i.bak '/_authToken/d' "$npmrc" && rm -f "$npmrc.bak"
            fi
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
